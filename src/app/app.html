<!-- LOGIN: Se muestra si NO está logueado -->
<div *ngIf="!isLoggedIn">
  <app-login></app-login>
</div>

<!-- APLICACIÓN: Se muestra si SÍ está logueado -->
<div *ngIf="isLoggedIn">
  <app-header (menuToggle)="onMenuToggle()" [appName]="appName"></app-header>

  <!-- Router outlet: aquí se cargan los componentes según la URL -->
  <router-outlet></router-outlet>

  <!-- Botón flotante para nueva cita (visible en todas las vistas) -->
  <app-floating-action-button (clicked)="openNewAppointmentForm()"></app-floating-action-button>

  <!-- Modal para mostrar citas del día seleccionado -->
  <app-day-modal 
    *ngIf="showDayModal && selectedDate"
    [date]="selectedDate"
    [citas]="citasForSelectedDate"
    (close)="closeDayModal()"
    (editCita)="onEditCita($event)"
    (changeStatusCita)="onCitaStatusChange($event)">
  </app-day-modal>

  <!-- Menú lateral (slide menu) -->
  <div class="side-menu-overlay" *ngIf="showSideMenu" (click)="closeSideMenu()"></div>
  <div class="side-menu" [class.open]="showSideMenu">
    <div class="side-menu-header">
      <h3>Menú</h3>
      <button class="close-button" (click)="closeSideMenu()">✕</button>
    </div>
    <nav class="side-menu-nav">
      <a routerLink="/calendar" (click)="closeSideMenu()" class="menu-item">📅 Inicio</a>
      <a routerLink="/calendar" (click)="closeSideMenu()" class="menu-item">📅 Calendario</a>
      <a routerLink="/clients" (click)="closeSideMenu()" class="menu-item">👥 Clientes</a>
      <a routerLink="/dashboard" (click)="closeSideMenu()" class="menu-item">📊 Dashboard</a>
      <a routerLink="/settings" (click)="closeSideMenu()" class="menu-item">⚙️ Configuración</a>
      <a href="#" class="menu-item logout-item" (click)="onLogout()">🚪 Cerrar Sesión</a>
    </nav>
  </div>

  <!-- Modales -->
  <app-new-date 
    *ngIf="showNewAppointmentForm" 
    [preselectedClient]="clientForNewAppointment"
    (close)="closeNewAppointmentForm()">
  </app-new-date>

  <app-status-change-modal 
    *ngIf="showStatusChangeModal && selectedCita"
    [cita]="selectedCita"
    (close)="closeStatusChangeModal()" 
    (statusChanged)="onStatusChanged($event)">
  </app-status-change-modal>

  <app-payment-status-change 
    *ngIf="showPaymentStatusModal && selectedCita"
    [cita]="selectedCita"
    (close)="closePaymentStatusModal()" 
    (paymentStatusChanged)="onPaymentStatusChanged($event)">
  </app-payment-status-change>

  <app-edit-date 
    *ngIf="showEditModal && selectedCita"
    [cita]="selectedCita"
    (close)="closeEditModal()">
  </app-edit-date>
</div>
