<!-- LOGIN: Se muestra si NO está logueado -->
<div *ngIf="!isLoggedIn">
  <app-login></app-login>
</div>

<!-- APLICACIÓN: Se muestra si SÍ está logueado -->
<div *ngIf="isLoggedIn">
  <app-header (menuToggle)="onMenuToggle()" [appName]="appName"></app-header>

  <!-- Vista Inicio: Calendar View -->
  <div *ngIf="currentView === 'home'">
    <app-calendar-view 
      (editCita)="onEditCita($event)" 
      (changeStatusCita)="onCitaStatusChange($event)"
      (changePaymentStatusCita)="onCitaPaymentStatusChange($event)">
    </app-calendar-view>
    <app-floating-action-button (clicked)="openNewAppointmentForm()"></app-floating-action-button>
  </div>

  <!-- Vista Calendario: Year/Month View -->
  <div *ngIf="currentView === 'calendar'">
    <div *ngIf="selectedMonth === null">
      <app-year-view 
        (monthSelected)="onMonthSelected($event)"
        (daySelected)="onDaySelected($event)">
      </app-year-view>
    </div>
    
    <div *ngIf="selectedMonth !== null">
      <app-month-view 
        [year]="getSelectedYear()"
        [month]="selectedMonth"
        (daySelected)="onDaySelected($event)"
        (back)="selectedMonth = null">
      </app-month-view>
    </div>
  </div>

  <!-- Vista Configuración -->
  <div *ngIf="currentView === 'settings'">
    <app-settings></app-settings>
  </div>

  <!-- Vista Clientes -->
  <div *ngIf="currentView === 'clients'">
    <app-clients (newAppointmentForClient)="onNewAppointmentForClient($event)"></app-clients>
  </div>

  <!-- Vista Dashboard -->
  <div *ngIf="currentView === 'dashboard'">
    <app-dashboard></app-dashboard>
  </div>

  <!-- Modal para mostrar citas del día seleccionado -->
  <app-day-modal 
    *ngIf="showDayModal && selectedDate"
    [date]="selectedDate"
    [citas]="citasForSelectedDate"
    (close)="closeDayModal()"
    (editCita)="onEditCita($event)"
    (changeStatusCita)="onCitaStatusChange($event)">
  </app-day-modal>

  <!-- Menú lateral (slide menu) -->
  <div class="side-menu-overlay" *ngIf="showSideMenu" (click)="closeSideMenu()"></div>
  <div class="side-menu" [class.open]="showSideMenu">
    <div class="side-menu-header">
      <h3>Menú</h3>
      <button class="close-button" (click)="closeSideMenu()">✕</button>
    </div>
    <nav class="side-menu-nav">
      <a href="#" class="menu-item" (click)="navigateTo('home')">🏠 Inicio</a>
      <a href="#" class="menu-item" (click)="navigateTo('calendar')">📅 Calendario</a>
      <a href="#" class="menu-item" (click)="navigateTo('clients')">👥 Clientes</a>
      <a href="#" class="menu-item" (click)="navigateTo('dashboard')">📊 Dashboard</a>
      <a href="#" class="menu-item" (click)="navigateTo('settings')">⚙️ Configuración</a>
      <a href="#" class="menu-item logout-item" (click)="onLogout()">🚪 Cerrar Sesión</a>
    </nav>
   </div>

   <!-- Modales -->
   <app-new-date 
     *ngIf="showNewAppointmentForm" 
     [preselectedClient]="clientForNewAppointment"
     (close)="closeNewAppointmentForm()" 
     (save)="saveNewAppointment($event)">
   </app-new-date>

  <app-status-change-modal 
    *ngIf="showStatusChangeModal && selectedCita"
    [cita]="selectedCita"
    (close)="closeStatusChangeModal()" 
    (statusChanged)="onStatusChanged($event)">
  </app-status-change-modal>

  <app-payment-status-change 
    *ngIf="showPaymentStatusModal && selectedCita"
    [cita]="selectedCita"
    (close)="closePaymentStatusModal()" 
    (paymentStatusChanged)="onPaymentStatusChanged($event)">
  </app-payment-status-change>

  <app-edit-date 
    *ngIf="showEditModal && selectedCita"
    [cita]="selectedCita"
    (close)="closeEditModal()" 
    (save)="onSaveEditedCita($event)">
  </app-edit-date>
</div>
