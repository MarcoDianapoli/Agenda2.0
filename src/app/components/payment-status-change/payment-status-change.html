<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Cambiar Estado de Pago</h2>
      <button class="close-button" (click)="onCancel()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Cita: {{ cita.title }}</label>
        <p>Monto total: <strong>${{ cita.amount | number:'1.2-2' }}</strong></p>
        <p>Estado actual de pago: <strong>{{ getPaymentStatusLabel(cita.paymentStatus) }}</strong></p>
        <p *ngIf="cita.paidAmount">Pagado hasta ahora: <strong>${{ cita.paidAmount | number:'1.2-2' }}</strong></p>
      </div>
      <div class="form-group">
        <label for="paymentStatus">Nuevo Estado de Pago</label>
        <select id="paymentStatus" name="paymentStatus" [(ngModel)]="selectedPaymentStatus">
          <option *ngFor="let opt of paymentStatusOptions" [value]="opt.value">
            {{ opt.label }}
          </option>
        </select>
      </div>
      
      <!-- Campo para monto pagado - solo visible cuando es Pagado o Pago Parcial -->
      <div class="form-group" *ngIf="shouldShowPaidAmount()">
        <label for="paidAmount">Monto Pagado ($)</label>
        <input 
          type="number" 
          id="paidAmount" 
          name="paidAmount"
          [(ngModel)]="paidAmount" 
          placeholder="0.00"
          min="0"
          [max]="cita.amount || 999999"
          step="0.01"
          class="paid-amount-input"
        />
        <small class="form-hint" *ngIf="selectedPaymentStatus === 'partial'">
          Ingresa el monto que el cliente ya pagó
        </small>
        <small class="form-hint" *ngIf="selectedPaymentStatus === 'paid'">
          Se registrará como pago completo
        </small>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
      <button type="button" class="btn-save" (click)="onSave()">Guardar</button>
    </div>
  </div>
</div>
