<div class="year-view-container">
  <!-- Header con navegación de año -->
  <div class="year-header">
    <button class="nav-btn" (click)="previousYear()">◀</button>
    <h2 class="year-title">{{ currentYear }}</h2>
    <button class="nav-btn" (click)="nextYear()">▶</button>
  </div>

  <!-- Grid de meses -->
  <div class="months-grid">
    <div 
      class="month-card"
      *ngFor="let month of months"
      (click)="onMonthClick(month.number)">
      <div class="month-name">{{ month.name }}</div>
      <div class="month-count" *ngIf="getAppointmentCount(month.number) > 0">
        {{ getAppointmentCount(month.number) }} citas
      </div>
      <div class="month-empty" *ngIf="getAppointmentCount(month.number) === 0">
        Sin citas
      </div>
    </div>
  </div>
</div>
